<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Call Log">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Tạo ảnh nhật ký cuộc gọi</title>
  <style>
    :root {
      color-scheme: light;
      --ui-font: Roboto, "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      --numeric-font: Roboto, "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      --bg: #eef1f4;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #6f7b86;
      --line: #d8dde3;
      --accent: #1f7a58;
      --accent-dark: #155d43;
      --danger: #cf4b55;
      --shadow: 0 18px 48px rgba(22, 31, 42, .12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--ui-font);
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0;
      display: grid;
      grid-template-columns: minmax(280px, 380px) minmax(320px, 1fr);
      gap: 24px;
      align-items: start;
    }

    .controls {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 20px;
      position: sticky;
      top: 20px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 44px;
      border: 1px solid #bfc7d0;
      border-radius: 6px;
      padding: 0 12px;
      font: 16px var(--numeric-font);
      color: var(--text);
      background: #fff;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 122, 88, .14);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .summary {
      margin-top: 18px;
      padding: 14px;
      background: #f6f8fa;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .summary strong {
      color: var(--text);
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      padding: 0 16px;
      font: 700 15px var(--ui-font);
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    button:hover {
      background: var(--accent-dark);
    }

    .secondary {
      background: #e5eaef;
      color: #1e2933;
    }

    .secondary:hover {
      background: #d5dce4;
    }

    .preview {
      display: grid;
      place-items: start center;
      min-width: 0;
    }

    .phone-frame {
      width: min(100%, 430px);
      background: #0a0a0a;
      border-radius: 8px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, .35);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
      }

      .controls {
        position: static;
      }

      .preview {
        place-items: center;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="controls" aria-label="Thông tin đầu vào">
      <h1>Tạo ảnh nhật ký cuộc gọi</h1>

      <label for="phoneInput">Số điện thoại</label>
      <input id="phoneInput" inputmode="numeric" autocomplete="off" value="0703262626" maxlength="14">

      <div class="row">
        <div>
          <label for="timeInput">Giờ</label>
          <input id="timeInput" type="time" value="15:03">
        </div>
        <div>
          <label for="dateInput">Ngày</label>
          <input id="dateInput" autocomplete="off" value="20/10">
        </div>
      </div>

      <div class="summary" id="summary" aria-live="polite"></div>

      <div class="actions">
        <button id="downloadBtn" type="button">Tải PNG</button>
        <button class="secondary" id="resetBtn" type="button">Đặt lại</button>
      </div>
    </section>

    <section class="preview" aria-label="Ảnh đầu ra">
      <div class="phone-frame">
        <canvas id="outputCanvas" width="663" height="1536"></canvas>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const phoneInput = document.getElementById('phoneInput');
    const timeInput = document.getElementById('timeInput');
    const dateInput = document.getElementById('dateInput');
    const summary = document.getElementById('summary');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const uiCanvasFont = 'Roboto, "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif';
    const numericCanvasFont = 'Roboto, "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif';

    const defaults = {
      phone: '0703262626',
      time: '15:03',
      date: '20/10'
    };

    function cleanPhone(value) {
      return value.replace(/\D/g, '').slice(0, 11);
    }

    function formatPhone(value) {
      const digits = cleanPhone(value);
      if (digits.length <= 4) return digits;
      if (digits.length <= 7) return `${digits.slice(0, 4)} ${digits.slice(4)}`;
      return `${digits.slice(0, 4)} ${digits.slice(4, 7)} ${digits.slice(7)}`;
    }

    function normalizeTime(value) {
      const match = /^(\d{1,2}):(\d{2})$/.exec(value.trim());
      if (!match) return defaults.time;
      const h = Math.min(23, Math.max(0, Number(match[1])));
      const m = Math.min(59, Math.max(0, Number(match[2])));
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function shiftTime(value, minutes) {
      const [h, m] = normalizeTime(value).split(':').map(Number);
      const day = 24 * 60;
      const shifted = (h * 60 + m + minutes + day) % day;
      return `${String(Math.floor(shifted / 60)).padStart(2, '0')}:${String(shifted % 60).padStart(2, '0')}`;
    }

    function rowTime(value) {
      const [h, m] = value.split(':');
      return `${Number(h)}:${m}`;
    }

    function drawText(text, x, y, size, color = '#f3f3f3', weight = 400, align = 'left', fontType = 'ui', baseline = 'alphabetic') {
      const fontFamily = fontType === 'numeric' ? numericCanvasFont : uiCanvasFont;
      ctx.fillStyle = color;
      ctx.font = `${weight} ${size}px ${fontFamily}`;
      ctx.fontKerning = 'normal';
      ctx.textAlign = align;
      ctx.textBaseline = baseline;
      ctx.fillText(text, x, y);
    }

    function drawLine(y) {
      ctx.strokeStyle = '#171717';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(45, y);
      ctx.lineTo(620, y);
      ctx.stroke();
    }

    function drawChevron(x, y) {
      ctx.strokeStyle = '#b7b7b7';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y - 10);
      ctx.lineTo(x + 10, y);
      ctx.lineTo(x, y + 10);
      ctx.stroke();
    }

    function drawBackArrow() {
      ctx.strokeStyle = '#e0e0e2';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(70, 107);
      ctx.lineTo(49, 127);
      ctx.lineTo(70, 147);
      ctx.moveTo(50, 127);
      ctx.lineTo(88, 127);
      ctx.stroke();
    }

    function drawSignalArea(time) {
      const top = 27;
      const center = 39;
      const bottom = 51;

      drawText(time, 37, center, 24, '#f1f1f1', 500, 'left', 'numeric', 'middle');
      drawText('0.00', 455, top, 11, '#fff', 700, 'center', 'numeric', 'top');
      drawText('KB/S', 455, top + 12, 10, '#fff', 700, 'center', 'ui', 'top');

      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(501, center - 1, 13, Math.PI * 1.16, Math.PI * 1.84);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(501, center + 3, 7, Math.PI * 1.18, Math.PI * 1.82);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(501, bottom - 2, 2.8, 0, Math.PI * 2);
      ctx.fill();

      drawText('4G', 535, top, 12, '#fff', 700, 'center', 'numeric', 'top');
      drawText('4G', 565, top, 12, '#fff', 700, 'center', 'numeric', 'top');
      for (let i = 0; i < 4; i += 1) {
        const barHeight = 5 + i * 4;
        ctx.fillRect(523 + i * 7, bottom - barHeight, 4, barHeight);
        ctx.fillRect(553 + i * 7, bottom - barHeight, 4, barHeight);
      }

      ctx.fillStyle = '#b5b5ba';
      ctx.beginPath();
      ctx.roundRect(584, top, 40, 22, 7);
      ctx.fill();
      ctx.fillStyle = '#8f8f94';
      ctx.beginPath();
      ctx.roundRect(624, center - 4, 4, 8, 2);
      ctx.fill();
      drawText('99%', 604, center, 11, '#111', 700, 'center', 'numeric', 'middle');
    }

    function drawCallIcon(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = '#89898e';
      ctx.fillStyle = '#89898e';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(-10, 10);
      ctx.lineTo(10, -10);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(1, -11);
      ctx.lineTo(11, -11);
      ctx.lineTo(11, -1);
      ctx.stroke();
      ctx.restore();
    }

    function drawCallRow(y, time, date) {
      drawText('Cuộc gọi đi', 45, y, 27, '#f4f4f4', 400);
      drawCallIcon(63, y + 29);
      drawText(rowTime(time), 84, y + 34, 22, '#89898e', 400, 'left', 'numeric');
      drawText('Chưa được kết nối', 139, y + 34, 22, '#8f8f94', 400);
      drawText(date, 594, y + 18, 21, '#a1a1a6', 400, 'center', 'numeric');
    }

    function drawTemplate() {
      const phone = formatPhone(phoneInput.value || defaults.phone);
      const time = normalizeTime(timeInput.value || defaults.time);
      const minus5 = shiftTime(time, -5);
      const minus10 = shiftTime(time, -10);
      const date = dateInput.value.trim() || defaults.date;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawSignalArea(time);
      drawBackArrow();
      drawText(phone, 104, 127, 36, '#efeff1', 500, 'left', 'numeric', 'middle');
      drawText('Meet', 45, 174, 25, '#f5f5f6', 400);
      drawText('/', 620, 175, 29, '#e8e8e8', 400, 'center');

      drawLine(239);

      drawText('Tóm tắt cuộc gọi', 45, 324, 30, '#e9e9eb', 400);
      drawChevron(616, 315);
      drawText('Bản ghi âm cuộc gọi', 45, 435, 30, '#e9e9eb', 400);
      drawChevron(616, 426);

      drawLine(501);

      drawText('Tạo liên hệ mới', 45, 586, 30, '#e9e9eb', 400);
      drawChevron(616, 577);
      drawText('Thêm vào liên lạc hiện có', 45, 699, 30, '#e9e9eb', 400);
      drawChevron(616, 690);

      drawLine(770);

      drawText('Gán thẻ số này', 45, 856, 30, '#e9e9eb', 400);
      drawChevron(616, 847);
      drawText('Chặn số', 45, 965, 30, '#ff6d77', 400);

      drawLine(1030);

      drawText('Nhật ký cuộc gọi', 45, 1091, 25, '#89898e', 400);
      drawText('Xóa', 594, 1091, 25, '#3ed072', 400, 'center');

      drawCallRow(1168, time, date);
      drawCallRow(1298, minus5, date);
      drawCallRow(1428, minus10, date);

      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(222, 1497);
      ctx.lineTo(441, 1497);
      ctx.stroke();

      summary.innerHTML = [
        `<strong>Số:</strong> ${phone}`,
        `<strong>Giờ:</strong> ${time}, ${minus5}, ${minus10}`,
        `<strong>Ngày:</strong> ${date}`
      ].join('<br>');
    }

    function downloadImage() {
      drawTemplate();
      const link = document.createElement('a');
      const now = new Date();
      const pad = (value) => String(value).padStart(2, '0');
      const timestamp = [
        now.getFullYear(),
        pad(now.getMonth() + 1),
        pad(now.getDate())
      ].join('') + '_' + [
        pad(now.getHours()),
        pad(now.getMinutes()),
        pad(now.getSeconds())
      ].join('');
      link.download = `Screenshot+${timestamp}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function resetValues() {
      phoneInput.value = defaults.phone;
      timeInput.value = defaults.time;
      dateInput.value = defaults.date;
      drawTemplate();
    }

    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function roundRect(x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        this.beginPath();
        this.moveTo(x + radius, y);
        this.arcTo(x + w, y, x + w, y + h, radius);
        this.arcTo(x + w, y + h, x, y + h, radius);
        this.arcTo(x, y + h, x, y, radius);
        this.arcTo(x, y, x + w, y, radius);
        this.closePath();
        return this;
      };
    }

    phoneInput.addEventListener('input', () => {
      phoneInput.value = cleanPhone(phoneInput.value);
      drawTemplate();
    });
    timeInput.addEventListener('input', drawTemplate);
    dateInput.addEventListener('input', drawTemplate);
    downloadBtn.addEventListener('click', downloadImage);
    resetBtn.addEventListener('click', resetValues);

    drawTemplate();

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
